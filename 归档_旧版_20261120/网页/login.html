<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 人数发票登记台账</title>
<script>
/* 首屏渲染前先套用上次选的配色，避免闪一下默认色 */
(function () {
    try {
        var t = localStorage.getItem('invoice-skin');
        if (t === 'a' || t === 'b' || t === 'c') {
            document.documentElement.setAttribute('data-theme', t);
        }
    } catch (e) {}
})();
</script><link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">

<!-- 背景装饰：圆弧 / 印章 / 天际线 -->
<svg class="arc arc1" width="440" height="440" viewBox="0 0 440 440" aria-hidden="true">
    <circle cx="220" cy="220" r="210" fill="none" stroke="rgba(200,164,92,0.18)" stroke-width="1"/>
    <circle cx="220" cy="220" r="168" fill="none" stroke="rgba(200,164,92,0.14)" stroke-width="1"/>
    <circle cx="220" cy="220" r="126" fill="none" stroke="rgba(200,164,92,0.10)" stroke-width="1"/>
    <circle cx="220" cy="220" r="84" fill="none" stroke="rgba(200,164,92,0.08)" stroke-width="1"/>
    <circle cx="220" cy="220" r="42" fill="none" stroke="rgba(200,164,92,0.06)" stroke-width="1"/>
</svg>
<svg class="arc arc2" width="380" height="380" viewBox="0 0 380 380" aria-hidden="true">
    <circle cx="190" cy="190" r="180" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
    <circle cx="190" cy="190" r="140" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <circle cx="190" cy="190" r="100" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <circle cx="190" cy="190" r="60" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
</svg>
<svg class="seal" viewBox="0 0 130 130" aria-hidden="true">
    <defs><path id="seal-circ" d="M65,14 A51,51 0 1,1 64.99,14"/></defs>
    <circle cx="65" cy="65" r="60" fill="none" stroke="#C8A45C" stroke-width="2"/>
    <circle cx="65" cy="65" r="52" fill="none" stroke="#C8A45C" stroke-width="1"/>
    <text fill="#C8A45C" font-size="8.5" letter-spacing="2.5">
        <textPath href="#seal-circ">人数发票登记台账 · INVOICE REGISTRATION SYSTEM · </textPath>
    </text>
    <text x="65" y="62" text-anchor="middle" fill="#C8A45C" font-size="22" font-weight="700">票</text>
    <text x="65" y="82" text-anchor="middle" fill="#C8A45C" font-size="7.5" letter-spacing="2">登记台账</text>
</svg>
<svg class="skyline" viewBox="0 0 1000 90" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,90 L0,52 L36,52 L36,38 L72,38 L72,58 L108,58 L108,28 L144,28 L144,48 L180,48 L180,22 L216,22 L216,42 L252,42 L252,32 L288,32 L288,54 L324,54 L324,18 L360,18 L360,46 L396,46 L396,36 L432,36 L432,58 L468,58 L468,26 L504,26 L504,42 L540,42 L540,22 L576,22 L576,52 L612,52 L612,32 L648,32 L648,48 L684,48 L684,16 L720,16 L720,42 L756,42 L756,58 L792,58 L792,28 L828,28 L828,48 L864,48 L864,36 L900,36 L900,54 L936,54 L936,28 L972,28 L972,46 L1000,46 L1000,90 Z" fill="#0A1A2F"/>
</svg>
<div class="login-divider" aria-hidden="true"></div>

<div class="login-wrap">
    <div class="login-card">
        <div class="login-brand">
            <span class="logo">票</span>
            <div><b>人数发票登记台账</b><span>INVOICE REGISTRATION SYSTEM</span></div>
        </div>

        <!-- 登录 -->
        <form id="loginForm" class="login-form" autocomplete="on">
            <h1>登录</h1>
            <label class="login-field">
                <span>用户名</span>
                <input id="username" name="username" autocomplete="username" required>
            </label>
            <label class="login-field">
                <span>密码</span>
                <span class="pw-wrap">
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                    <button type="button" class="pw-eye" data-pw="password" title="显示密码" aria-label="显示密码"></button>
                </span>
            </label>
            <div class="login-msg" id="loginMsg"></div>
            <button type="submit" class="login-btn" id="loginBtn">登 录</button>
            <div class="login-foot">
                还没有账号？<a href="javascript:void(0)" id="toRegister">注册一个</a>
            </div>
        </form>

        <!-- 注册 -->
        <form id="registerForm" class="login-form" hidden autocomplete="off">
            <h1>注册</h1>
            <div class="login-tip">注册后只能提交发票、查看自己的提交记录。</div>
            <label class="login-field">
                <span>用户名</span>
                <input id="rUsername" autocomplete="username" required
                       placeholder="字母开头，3-20 位">
            </label>
            <label class="login-field">
                <span>姓名</span>
                <input id="rDisplay" placeholder="填真实姓名，方便财务核对">
            </label>
            <label class="login-field">
                <span>密码</span>
                <span class="pw-wrap">
                    <input id="rPassword" type="password" autocomplete="new-password"
                           required placeholder="至少 8 位">
                    <button type="button" class="pw-eye" data-pw="rPassword" title="显示密码" aria-label="显示密码"></button>
                </span>
            </label>
            <label class="login-field">
                <span>确认密码</span>
                <input id="rPassword2" type="password" autocomplete="new-password" required>
            </label>
            <div class="login-msg" id="regMsg"></div>
            <button type="submit" class="login-btn" id="regBtn">注册并登录</button>
            <div class="login-foot">
                已有账号？<a href="javascript:void(0)" id="toLogin">去登录</a>
            </div>
        </form>
    </div>
    <div class="login-copy">© 2026 人数发票登记台账 · 温州信宇科技 · <b>构建 20261119</b></div>
</div>

<script>
'use strict';
var $ = function (id) { return document.getElementById(id); };

var EYE = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">' +
    '<path d="M1.8 12S5.4 5.6 12 5.6 22.2 12 22.2 12 18.6 18.4 12 18.4 1.8 12 1.8 12Z" ' +
    'fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>' +
    '<circle cx="12" cy="12" r="3.1" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>';
var EYE_OFF = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">' +
    '<path d="M1.8 12S5.4 5.6 12 5.6 22.2 12 22.2 12 18.6 18.4 12 18.4 1.8 12 1.8 12Z" ' +
    'fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>' +
    '<circle cx="12" cy="12" r="3.1" fill="none" stroke="currentColor" stroke-width="1.7"/>' +
    '<path d="M3.4 3.4 L20.6 20.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';

function initEyes() {
    document.querySelectorAll('.pw-eye').forEach(function (btn) {
        btn.innerHTML = EYE;
        btn.addEventListener('click', function (ev) {
            ev.preventDefault();
            var el = document.getElementById(btn.dataset.pw);
            if (!el) return;
            var show = el.type === 'password';
            el.type = show ? 'text' : 'password';
            btn.innerHTML = show ? EYE_OFF : EYE;
            btn.classList.toggle('on', show);
            btn.title = show ? '隐藏密码' : '显示密码';
            el.focus();
        });
    });
}
initEyes();

function msg(el, text, kind) {
    el.textContent = text || '';
    el.className = 'login-msg' + (text ? ' show ' + (kind || '') : '');
}

function post(url, obj) {
    return fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(obj || {})
    }).then(function (r) {
        return r.json().catch(function () { return { ok: false, error: '服务无响应' }; });
    });
}

/* 已经登录过就直接进去 */
fetch('/api/ping').then(function (r) { return r.json(); }).then(function (r) {
    if (r && r.logged_in) location.href = '/';
}).catch(function () {});

$('loginForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var btn = $('loginBtn');
    btn.disabled = true;
    msg($('loginMsg'), '');
    post('/api/login', {
        username: $('username').value.trim(),
        password: $('password').value
    }).then(function (r) {
        btn.disabled = false;
        if (!r.ok) { msg($('loginMsg'), r.error || '登录失败', 'err'); return; }
        location.href = '/';
    }).catch(function () {
        btn.disabled = false;
        msg($('loginMsg'), '网络错误', 'err');
    });
});

$('toRegister').addEventListener('click', function () {
    $('loginForm').hidden = true;
    $('registerForm').hidden = false;
    $('rUsername').focus();
});
$('toLogin').addEventListener('click', function () {
    $('registerForm').hidden = true;
    $('loginForm').hidden = false;
    $('username').focus();
});

$('registerForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var btn = $('regBtn');
    var p1 = $('rPassword').value, p2 = $('rPassword2').value;
    if (p1 !== p2) { msg($('regMsg'), '两次输入的密码不一样', 'err'); return; }
    btn.disabled = true;
    msg($('regMsg'), '');
    post('/api/register', {
        username: $('rUsername').value.trim(),
        display_name: $('rDisplay').value.trim(),
        password: p1
    }).then(function (r) {
        btn.disabled = false;
        if (!r.ok) { msg($('regMsg'), r.error || '注册失败', 'err'); return; }
        location.href = '/';
    }).catch(function () {
        btn.disabled = false;
        msg($('regMsg'), '网络错误', 'err');
    });
});
</script>
</body>
</html>
